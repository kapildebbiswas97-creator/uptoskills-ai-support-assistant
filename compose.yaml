services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [infrastructure]
    environment:
      POSTGRES_DB: uptoskills
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      UTS_DB_READER_PASSWORD: ${UTS_DB_READER_PASSWORD:?Set UTS_DB_READER_PASSWORD in .env}
      UTS_DB_WRITER_PASSWORD: ${UTS_DB_WRITER_PASSWORD:?Set UTS_DB_WRITER_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uptoskills"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    profiles: [infrastructure]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
